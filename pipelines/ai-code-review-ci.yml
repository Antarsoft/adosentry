# CI for the ai-code-review engine: Pester tests and PSScriptAnalyzer.
# Runs on pushes to main and as the build validation policy for PRs into main
# (Azure Repos ignores the YAML pr: trigger; the branch policy queues PR runs).

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - ai-code-review/*
      - pipelines/ai-code-review-ci.yml

pr: none

name: ai-code-review-ci-$(Date:yyyyMMdd)$(Rev:.r)

pool:
  vmImage: ubuntu-latest

variables:
  pesterVersion: "5.6.1"
  analyzerVersion: "1.23.0"

jobs:
  - job: Test
    displayName: "Pester and PSScriptAnalyzer"
    steps:
      - checkout: self
        fetchDepth: 1

      - pwsh: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion $(pesterVersion) -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion $(analyzerVersion) -Scope CurrentUser -Force
        displayName: "Install Pester and PSScriptAnalyzer"

      - pwsh: |
          Import-Module Pester -RequiredVersion $(pesterVersion)
          $config = New-PesterConfiguration
          $config.Run.Path = 'ai-code-review/tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = '$(Agent.TempDirectory)/pester-results.xml'
          Invoke-Pester -Configuration $config
        displayName: "Run Pester tests"

      - task: PublishTestResults@2
        displayName: "Publish test results"
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: NUnit
          testResultsFiles: "$(Agent.TempDirectory)/pester-results.xml"
          testRunTitle: "ai-code-review Pester"
          failTaskOnFailedTests: true

      - pwsh: |
          Import-Module PSScriptAnalyzer -RequiredVersion $(analyzerVersion)
          # Engine scripts only (no -Recurse): the tests use stub functions and fake tokens on purpose.
          $findings = Invoke-ScriptAnalyzer -Path ai-code-review -Settings ai-code-review/PSScriptAnalyzerSettings.psd1
          foreach ($f in $findings) {
            Write-Host "##vso[task.logissue type=error;sourcepath=$($f.ScriptPath);linenumber=$($f.Line)]$($f.RuleName): $($f.Message)"
          }
          if ($findings) { throw "PSScriptAnalyzer reported $(@($findings).Count) finding(s)." }
          Write-Host "PSScriptAnalyzer: no findings."
        displayName: "Run PSScriptAnalyzer"
        condition: succeededOrFailed()
