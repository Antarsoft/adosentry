# CI for AdoSentry: PowerShell engine tests and analyzer, the Go metrics API, a secret scan and Bicep lint.
# Every action is pinned by commit SHA (Dependabot keeps the pins current).
name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  powershell:
    name: PowerShell (Pester + PSScriptAnalyzer)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PESTER_VERSION: "5.6.1"
      ANALYZER_VERSION: "1.23.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion $env:PESTER_VERSION -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion $env:ANALYZER_VERSION -Scope CurrentUser -Force

      - name: Run Pester tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION
          $config = New-PesterConfiguration
          $config.Run.Path = 'ai-code-review/tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = 'pester-results.xml'
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pester-results
          path: pester-results.xml
          if-no-files-found: error

      - name: Run PSScriptAnalyzer
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer -RequiredVersion $env:ANALYZER_VERSION
          # Engine scripts only (no -Recurse): the tests use stub functions and fake tokens on purpose.
          $findings = Invoke-ScriptAnalyzer -Path ai-code-review -Settings ai-code-review/PSScriptAnalyzerSettings.psd1
          foreach ($f in $findings) {
            Write-Host "::error file=$($f.ScriptPath),line=$($f.Line)::$($f.RuleName): $($f.Message)"
          }
          if ($findings) { throw "PSScriptAnalyzer reported $(@($findings).Count) finding(s)." }
          Write-Host "PSScriptAnalyzer: no findings."

  go:
    name: Go (metrics API)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: metrics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: metrics/go.mod
          cache-dependency-path: metrics/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: go build
        run: go build ./...

  docker:
    name: Docker image (metrics API, no push)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: adosentry-metrics:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --pull --tag "$IMAGE" metrics

      - name: Check image runs as non-root
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' "$IMAGE")"
          echo "Image user: ${user:-<none>}"
          case "$user" in
            ""|root|0|0:*|root:*) echo "::error::Image must not run as root."; exit 1 ;;
          esac

      - name: Smoke test /healthz
        run: |
          # Dummy Cosmos settings: the client is created lazily, and /healthz never calls Cosmos.
          # No COSMOS_KEY, so the image starts in its production mode (Entra ID / managed identity).
          # AUTH_MODE=entra with a dummy tenant: signing keys are fetched on the first token, not at startup.
          docker run -d --name metrics-smoke -p 8080:8080 \
            -e COSMOS_ENDPOINT=https://example.documents.azure.com:443/ \
            -e COSMOS_DATABASE=ci \
            -e COSMOS_CONTAINER=ci \
            -e AUTH_MODE=entra \
            -e ENTRA_TENANT_ID=00000000-0000-0000-0000-000000000000 \
            -e ENTRA_AUDIENCE=api://adosentry-metrics-ci \
            "$IMAGE"
          for _ in $(seq 1 15); do
            if curl -fsS http://localhost:8080/healthz; then
              echo
              # An unauthenticated write must be refused before it reaches Cosmos.
              status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
                -d '{"featureName":"ci"}' http://localhost:8080/events)"
              if [ "$status" != "401" ]; then
                echo "::error::POST /events without credentials returned $status, want 401."
                docker logs metrics-smoke
                exit 1
              fi
              echo "POST /events without credentials: 401"
              exit 0
            fi
            sleep 1
          done
          echo "::error::/healthz did not answer within 15 seconds."
          docker logs metrics-smoke
          exit 1

      - name: Stop container
        if: ${{ always() }}
        run: docker rm -f metrics-smoke || true

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan full history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .

  bicep:
    name: Bicep (build + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BICEP_VERSION: "0.48.1"
      BICEP_SHA256: "b09ec25a9d376c1f8e33ede6ed22b587f915ad68488d5db77a6f9541748c7f6e"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Standalone CLI pinned by version and checksum; `az bicep install` would pull whatever is latest.
      - name: Install Bicep CLI
        run: |
          curl -sSfL -o "$RUNNER_TEMP/bicep" \
            "https://github.com/Azure/bicep/releases/download/v${BICEP_VERSION}/bicep-linux-x64"
          echo "${BICEP_SHA256}  $RUNNER_TEMP/bicep" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bicep"
          "$RUNNER_TEMP/bicep" --version

      # Linter rules and their levels live in infra/bicepconfig.json; any error-level finding fails the job.
      - name: Build and lint infra/
        run: |
          status=0
          while IFS= read -r -d '' file; do
            echo "::group::$file"
            case "$file" in
              *.bicepparam) "$RUNNER_TEMP/bicep" build-params "$file" --stdout > /dev/null || status=1 ;;
              *)            "$RUNNER_TEMP/bicep" build "$file" --stdout > /dev/null || status=1 ;;
            esac
            "$RUNNER_TEMP/bicep" lint "$file" || status=1
            echo "::endgroup::"
          done < <(find infra -type f \( -name '*.bicep' -o -name '*.bicepparam' \) -print0 | sort -z)
          exit "$status"
