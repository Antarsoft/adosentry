parameters:
  # Path to the repository's rules file (or, with promptMode: legacy, its complete prompt), relative to
  # the repository root. The file is left out of its own review.
  - name: promptFile
    type: string
  # 'rules' (default): promptFile is the repo's short rules file and the engine adds its shared
  # base prompt (prompts/base.codereviewprompt.md). 'legacy': promptFile is the repo's complete prompt.
  - name: promptMode
    type: string
    default: "rules"
    values:
      - rules
      - legacy
  # Azure Resource Manager service connection the review runs as. Its identity must be able to
  # comment on pull requests (member of the Azure DevOps organisation) and, with foundryAuth: entra,
  # hold the Cognitive Services OpenAI User role on the model's Azure OpenAI / Foundry resource.
  - name: azureSubscription
    type: string
  # Variable group with modelName, modelDeploymentUrl, reasoningEffort (and foundry-key for foundryAuth: key).
  - name: modelVariableGroup
    type: string
    default: "ai-code-review"
  # Optional variable group for the metrics API. Leave empty to send no metrics. It holds
  # aiMetricsApiUrl, plus aiMetricsApiResource (metricsAuth: entra) or aiMetricsApiKey (metricsAuth: key).
  - name: metricsVariableGroup
    type: string
    default: ""
  # How the review proves itself to the metrics API (its AUTH_MODE). 'entra' (default) gets a token
  # for aiMetricsApiResource, the API's application ID URI, with the service connection's identity,
  # which needs the API's Events.Write app role. 'key' sends aiMetricsApiKey as X-Api-Key; the key is
  # only mapped into the step in that mode.
  - name: metricsAuth
    type: string
    default: "entra"
    values:
      - entra
      - key
  # Set to true to let the pipeline carry on when the review step fails (for example, the model is
  # unreachable). The step then shows as succeeded with issues instead of failed.
  - name: continueOnError
    type: boolean
    default: false
  # Set to 'true' to log the full diff for one pipeline. Leave empty to use the
  # aiReviewDebugLogging variable from the model variable group (false when unset).
  - name: aiReviewDebugLogging
    type: string
    default: ""
  # Space-separated git pathspecs; only matching files are reviewed. Empty reviews every changed file.
  - name: reviewPathSpec
    type: string
    default: ""
  # Space-separated wildcard patterns matched against repo-relative paths (such as 'docs/* *.generated.cs').
  # Matching files are skipped, on top of the default excludes.
  - name: reviewExcludePathSpec
    type: string
    default: ""
  # Most files sent to the model in one request. Larger pull requests are split into batches.
  - name: reviewMaxFilesPerBatch
    type: number
    default: 25
  # Approximate token budget for one request, prompt included. A batch the model rejects as too large is
  # split in two and retried.
  - name: reviewMaxBatchTokens
    type: number
    default: 300000
  # Approximate token limit for one file's diff. Lines past it are not reviewed and the run summary
  # counts the file as truncated.
  - name: reviewMaxFileTokens
    type: number
    default: 80000
  # Set to true to list deleted file paths (not their content) in the review input, so the model can flag a
  # risky deletion with a comment on the pull request as a whole.
  - name: reviewDeletedFiles
    type: boolean
    default: false
  # Skip lockfiles, minified files and source maps, images, fonts, documents, archives and binaries.
  - name: reviewDefaultExcludes
    type: boolean
    default: true
  # Set to true to send read-only context from the rest of the repository with each batch: a map of the
  # repository's files, plus excerpts of files that use what the pull request changes and of files the changed
  # files import. It is read from the pipeline's own checkout with git (no extra access) and costs extra prompt
  # tokens, up to reviewContextMaxTokens per batch. The model still only comments on the diff.
  - name: reviewRepoContext
    type: boolean
    default: false
  # Approximate token budget for repository context in one request. It is taken out of reviewMaxBatchTokens, so
  # requests do not grow; the diff keeps at least half. Only used with reviewRepoContext: true.
  - name: reviewContextMaxTokens
    type: number
    default: 12000
  # 'entra' (default) signs in with the service connection's identity (it needs the Cognitive
  # Services OpenAI User role on the Foundry account). 'key' uses the foundry-key variable from
  # the model variable group instead; the key is only mapped into the step in that mode.
  - name: foundryAuth
    type: string
    default: "entra"
    values:
      - entra
      - key
  # Resource the Entra token is requested for with foundryAuth: entra. The default suits Azure AI Foundry;
  # use https://cognitiveservices.azure.com for a classic Azure OpenAI resource.
  - name: foundryTokenResource
    type: string
    default: "https://ai.azure.com"

stages:
  - stage: AICodeReview
    displayName: "AI Code Review"
    # Only pull request runs have a pull request to review. Skip the stage on CI, manual and
    # scheduled runs instead of failing on the missing System.PullRequest.* variables.
    condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
    variables:
      - group: ${{ parameters.modelVariableGroup }}
      - ${{ if ne(parameters.metricsVariableGroup, '') }}:
          - group: ${{ parameters.metricsVariableGroup }}
      - ${{ if ne(parameters.aiReviewDebugLogging, '') }}:
          - name: aiReviewDebugLogging
            value: ${{ parameters.aiReviewDebugLogging }}
    jobs:
      - job: AICodeReviewJob
        displayName: "Automated Code Reviewer"
        steps:
          # Explicit `path:` on both checkouts keeps paths stable regardless of the
          # consuming repo's name -- with multiple checkouts, ADO otherwise places
          # each repo under $(Pipeline.Workspace)/<repo-name>, which would make the
          # script path below different in every consuming repo.
          - checkout: self
            path: s
            fetchDepth: 0

          - checkout: templates
            path: templates
            fetchDepth: 1

          - task: AzurePowerShell@5
            displayName: "Run AI Code Review"
            continueOnError: ${{ parameters.continueOnError }}
            inputs:
              azureSubscription: ${{ parameters.azureSubscription }}
              ScriptType: "InlineScript"
              azurePowerShellVersion: LatestVersion
              pwsh: true
              # String parameters inside '...' go through replace(..., , '') so a single
              # quote in a path or path spec is doubled (PowerShell's escape) instead of ending the string.
              Inline: |
                Import-Module "$(Pipeline.Workspace)/templates/ai-code-review/AICodeReview.psd1" -Force -ErrorAction Stop

                $reviewResult = $null
                $postResult = $null
                $reviewFailure = $null
                $partialFailure = $null
                $errorType = $null
                $errorStatusCode = $null
                $phase = 'history'

                try {
                    $existingThreadData = Get-ExistingReviewThreads `
                      -CollectionUri $env:AICR_COLLECTION_URI `
                      -PullRequestId $env:AICR_PULL_REQUEST_ID `
                      -Project $env:AICR_PROJECT `
                      -RepositoryName $env:AICR_REPOSITORY

                    $phase = 'review'
                    $reviewResult = Invoke-LLMCodeReview `
                      -SourceBranch $env:AICR_SOURCE_BRANCH `
                      -TargetBranch $env:AICR_TARGET_BRANCH `
                      -PathToReviewFile '$(Build.SourcesDirectory)/${{ replace(parameters.promptFile, '''', '''''') }}' `
                      -ModelName '$(modelName)' `
                      -ModelDeploymentUrl '$(modelDeploymentUrl)' `
                      -ReasoningEffort '$(reasoningEffort)' `
                      -Key $env:FOUNDRY_KEY `
                      -AuthMode '${{ parameters.foundryAuth }}' `
                      -PromptMode '${{ parameters.promptMode }}' `
                      -BasePromptFile '$(Pipeline.Workspace)/templates/ai-code-review/prompts/base.codereviewprompt.md' `
                      -TokenResource '${{ replace(parameters.foundryTokenResource, '''', '''''') }}' `
                      -LogFullDiff '$(aiReviewDebugLogging)' `
                      -PriorReviewHistory $existingThreadData.Threads `
                      -PathSpec '${{ replace(parameters.reviewPathSpec, '''', '''''') }}' `
                      -ExcludePathSpec '${{ replace(parameters.reviewExcludePathSpec, '''', '''''') }} ${{ replace(parameters.promptFile, '''', '''''') }}' `
                      -MaxFilesPerBatch ${{ parameters.reviewMaxFilesPerBatch }} `
                      -MaxBatchTokens ${{ parameters.reviewMaxBatchTokens }} `
                      -MaxFileTokens ${{ parameters.reviewMaxFileTokens }} `
                      -ReviewDeletedFiles '${{ parameters.reviewDeletedFiles }}' `
                      -UseDefaultExcludes '${{ parameters.reviewDefaultExcludes }}' `
                      -RepoContext '${{ parameters.reviewRepoContext }}' `
                      -ContextMaxTokens ${{ parameters.reviewContextMaxTokens }}

                    $phase = 'post'
                    $postResult = Set-PullRequestComments `
                      -CollectionUri $env:AICR_COLLECTION_URI `
                      -PullRequestId $env:AICR_PULL_REQUEST_ID `
                      -Project $env:AICR_PROJECT `
                      -RepositoryName $env:AICR_REPOSITORY `
                      -Reviews $reviewResult.Content `
                      -ExistingThreads $existingThreadData.Threads

                    # Some batches failed: the comments from the others are already posted above.
                    # Report the run as partial, then fail the step after the metrics are sent.
                    $failedBatchList = @($reviewResult.FailedBatches)
                    if ($failedBatchList.Count -gt 0) {
                        $firstFailure = $failedBatchList[0]
                        $partialFailure = "AI review incomplete: $($failedBatchList.Count) of $($reviewResult.BatchCount) batch(es) failed. First error: $($firstFailure.Message)"
                        Write-Host $partialFailure
                        $errorType = $firstFailure.ErrorType
                        $errorStatusCode = $firstFailure.StatusCode
                        $reviewFailure = [System.Management.Automation.ErrorRecord]::new(
                            [System.Exception]::new($partialFailure), 'PartialReview', [System.Management.Automation.ErrorCategory]::NotSpecified, $null)
                    }
                }
                catch {
                    $reviewFailure = $_
                    Write-Host "AI Code Review failed: $($reviewFailure.Exception.Message)"

                    $errorInfo = Get-ReviewErrorInfo -Message $reviewFailure.Exception.Message
                    $errorType = $errorInfo.ErrorType
                    $errorStatusCode = $errorInfo.StatusCode
                    if ($phase -eq 'post') {
                        # The review itself worked but its comments could not be posted.
                        $errorType = 'post-failed'
                        $errorStatusCode = $null
                    }
                }

                $runOutcome = if ($partialFailure) { 'partial' } elseif ($errorType) { 'error' } else { $postResult.Outcome }
                $engineVersion = 'unknown'
                try {
                    $engineVersion = Get-EngineVersion -TemplatesPath "$(Pipeline.Workspace)/templates"
                    Write-Host (Format-ReviewSummary -ReviewResult $reviewResult -PostResult $postResult -Outcome $runOutcome -ErrorType $errorType)
                }
                catch {
                    Write-Warning "Could not build the run summary: $_"
                }

                $metricsUrl = [string]$env:AI_METRICS_API_URL
                if (-not $metricsUrl -or $metricsUrl.StartsWith('$(')) {
                    Write-Host "Metrics are not configured (no aiMetricsApiUrl); skipping the metrics event."
                } else {
                try {
                    $metricsEvent = [ordered]@{
                        featureName = 'ai-code-review'
                        source      = 'ado-pipeline'
                        custom      = [ordered]@{
                            adoProject               = [string]$env:AICR_PROJECT
                            repository               = [string]$env:AICR_REPOSITORY
                            prId                     = [string]$env:AICR_PULL_REQUEST_ID
                            pipelineRunId            = '$(Build.BuildId)'
                            sourceBranch             = [string]$env:AICR_SOURCE_BRANCH
                            targetBranch             = [string]$env:AICR_TARGET_BRANCH
                            filesReviewed            = if ($reviewResult) { $reviewResult.FilesReviewed } else { 0 }
                            totalFilesChanged        = if ($reviewResult) { $reviewResult.TotalFilesChanged } else { 0 }
                            filesExcluded            = if ($reviewResult) { $reviewResult.FilesExcluded } else { 0 }
                            filesRenamed             = if ($reviewResult) { $reviewResult.FilesRenamed } else { 0 }
                            filesDeleted             = if ($reviewResult) { $reviewResult.FilesDeleted } else { 0 }
                            filesTruncated           = if ($reviewResult) { $reviewResult.FilesTruncated } else { 0 }
                            batchesSplit             = if ($reviewResult) { $reviewResult.BatchesSplit } else { 0 }
                            commentsSnapped          = if ($reviewResult) { $reviewResult.CommentsSnapped } else { 0 }
                            commentsInvalid          = if ($reviewResult) { $reviewResult.CommentsInvalid } else { 0 }
                            batchesFailed            = if ($reviewResult) { @($reviewResult.FailedBatches).Count } else { 0 }
                            engineVersion            = $engineVersion
                            reviewBatchCount         = if ($reviewResult) { $reviewResult.BatchCount } else { 0 }
                            linesAdded               = if ($reviewResult) { $reviewResult.LinesAdded } else { 0 }
                            linesRemoved             = if ($reviewResult) { $reviewResult.LinesRemoved } else { 0 }
                            commentsProposed         = if ($postResult) { $postResult.CommentsProposed } else { 0 }
                            commentsCount            = if ($postResult) { $postResult.CommentsPosted } else { 0 }
                            commentsSkippedDuplicate = if ($postResult) { $postResult.CommentsSkippedDuplicate } else { 0 }
                            outcome                  = $runOutcome
                            severityBreakdown        = if ($postResult) { $postResult.SeverityBreakdown } else { @{ critical = 0; warning = 0; suggestion = 0; unknown = 0 } }
                            filesWithComments        = if ($postResult) { $postResult.FilesWithComments } else { @() }
                            latencyMs                = if ($reviewResult) { $reviewResult.LatencyMs } else { 0 }
                            promptTokens             = if ($reviewResult) { $reviewResult.PromptTokens } else { 0 }
                            completionTokens         = if ($reviewResult) { $reviewResult.CompletionTokens } else { 0 }
                            reasoningTokens          = if ($reviewResult) { $reviewResult.ReasoningTokens } else { 0 }
                            cachedTokens             = if ($reviewResult) { $reviewResult.CachedTokens } else { 0 }
                            tokensUsed               = if ($reviewResult) { $reviewResult.TotalTokens } else { 0 }
                            contextFiles             = if ($reviewResult) { [int]$reviewResult.ContextFiles } else { 0 }
                            contextTokens            = if ($reviewResult) { [int]$reviewResult.ContextTokens } else { 0 }
                            model                    = '$(modelName)'
                        }
                    }
                    if ($errorType) {
                        $metricsEvent.custom.errorType = $errorType
                        if ($errorStatusCode) { $metricsEvent.custom.errorStatusCode = $errorStatusCode }
                    }

                    $metricsHeaders = Get-MetricsRequestHeaders `
                        -AuthMode '${{ parameters.metricsAuth }}' `
                        -Resource ([string]$env:AI_METRICS_API_RESOURCE) `
                        -Key ([string]$env:AI_METRICS_API_KEY)

                    Invoke-RestMethod -Uri "$($metricsUrl.TrimEnd('/'))/events" `
                        -Method Post `
                        -Headers $metricsHeaders `
                        -ContentType 'application/json' `
                        -Body ($metricsEvent | ConvertTo-Json -Depth 10) | Out-Null
                    Write-Host "AI Code Review metrics event sent."
                }
                catch {
                    Write-Warning "Failed to send AI Code Review metrics event: $_"
                }
                }

                if ($reviewFailure) {
                    throw $reviewFailure
                }
            # Values a pull request author or project admin can choose (branch, project and
            # repository names) reach the script as environment variables, never as text pasted
            # into the inline script, so quotes or $(...) in them cannot change the script.
            env:
              AICR_COLLECTION_URI: $(System.CollectionUri)
              AICR_PROJECT: $(System.TeamProject)
              AICR_REPOSITORY: $(Build.Repository.Name)
              AICR_PULL_REQUEST_ID: $(System.PullRequest.PullRequestId)
              AICR_SOURCE_BRANCH: $(System.PullRequest.SourceBranch)
              AICR_TARGET_BRANCH: $(System.PullRequest.TargetBranch)
              ${{ if eq(parameters.foundryAuth, 'key') }}:
                FOUNDRY_KEY: $(foundry-key)
              AI_METRICS_API_URL: $(aiMetricsApiUrl)
              ${{ if eq(parameters.metricsAuth, 'key') }}:
                AI_METRICS_API_KEY: $(aiMetricsApiKey)
              ${{ if eq(parameters.metricsAuth, 'entra') }}:
                AI_METRICS_API_RESOURCE: $(aiMetricsApiResource)
