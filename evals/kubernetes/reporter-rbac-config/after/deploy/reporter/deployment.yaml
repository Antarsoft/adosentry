apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporter
  namespace: reporting
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: reporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reporter
    spec:
      serviceAccountName: reporter
      securityContext:
        runAsNonRoot: true
      containers:
        - name: reporter
          image: registry.example.com/reporting/reporter:3.5.0
          envFrom:
            - configMapRef:
                name: reporter-config
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
