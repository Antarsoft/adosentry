apiVersion: apps/v1
kind: Deployment
metadata:
  name: build-agent
  namespace: ci
  labels:
    app.kubernetes.io/name: build-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: build-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: build-agent
    spec:
      serviceAccountName: build-agent
      containers:
        - name: agent
          image: registry.example.com/ci/build-agent:latest
          securityContext:
            privileged: true
          env:
            - name: AGENT_POOL
              value: linux-default
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
