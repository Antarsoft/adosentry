apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orders-api-secrets
  namespace: orders
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: orders-api-secrets
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: orders-db-password
