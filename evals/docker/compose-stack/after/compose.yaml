services:
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    depends_on: [db]
  worker:
    image: registry.example.com/jobs/worker:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: .env
  db:
    image: postgres:16.4
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: Sup3rS3cret-db
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
